services:
  - type: web
    name: hello
    env: python
    buildCommand: "python -m pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host=0.0.0.0"
    repo: https://github.com/nalediym/chatbot-prototype.git
    region: oregon
    plan: free
    branch: main
    numInstances: 1
