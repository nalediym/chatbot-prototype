<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chereena Chat UI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #ffffff;
      color: #333;
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      border-right: 1px solid #ddd;
    }

    .new-chat {
      background-color: #f4a261;
      color: #000;
      font-weight: 600;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .sidebar nav ul {
      list-style: none;
      padding: 0;
    }

    .sidebar nav li {
      margin: 1.2rem 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      font-size: 14px;
    }

    .footer-links a {
      text-decoration: none;
      color: #333;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main section */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #0077cc;
    }

    .auth-buttons button {
      margin-left: 10px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }

    /* Chat body */
    .chat-window {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow-y: auto;
    }

    .message {
      margin: 0.8rem 0;
    }

    .message.user {
      text-align: right;
      color: #0077cc;
    }

    .message.bot {
      text-align: left;
      color: #333;
    }

    /* Chat input */
    .chatbar {
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      border-top: 1px solid #ddd;
      background-color: #fff;
      gap: 1rem;
    }

    .chatbar input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    .chatbar button {
      background-color: #0077cc;
      color: white;
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    /* Dark Mode */
    body.dark-mode {
      background-color: #0d0d25;
      color: #ffffff;
    }

    .dark-mode .sidebar {
      background-color: #151538;
    }

    .dark-mode .main {
      background-color: #0d0d25;
    }

    .dark-mode .chatbar {
      background-color: #151538;
      border-top: 1px solid #333;
    }

    .dark-mode .chatbar input[type="text"] {
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
    }

    .dark-mode .chatbar button {
      background-color: #5eb1ff;
      color: #000;
    }

    .dark-mode .chat-window {
      background-color: #0d0d25;
      color: #fff;
    }

    .dark-mode .auth-buttons button {
      background-color: #222;
      color: white;
      border: 1px solid #666;
    }

    .dark-mode .footer-links a {
      color: #5eb1ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <button class="new-chat" onclick="window.location.href='/new_chat'">📝 New Chat</button>
      <nav>
        <ul>
          <li>ITSMF Emerge Academy</li>
        </ul>
      </nav>
      <div class="footer-links">
        <a href="#" id="clearChat">Clear Conversations</a>
        <a href="#" id="darkModeToggle">Dark Mode</a>
        <a href="https://itsmfleaders.org/" target="_blank">ITSMF Home</a>
      </div>
    </aside>

    <div class="main">
      <header class="chat-header">
        <span class="model-name">Chereena 2.0 ⌄</span>
        <span class="logo">itsmf</span>
        <div class="auth-buttons">
          <button>Login</button>
          <button>Sign Up</button>
        </div>
      </header>

      <div class="chat-window" id="chatWindow">
        <!-- Chat messages go here -->
      </div>

      <div class="chatbar">
        <input type="text" placeholder="Message Chereena" id="chatInput" />
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
  <script>
    function toggleDarkMode() {
      const body = document.body;
      const isDark = body.classList.toggle("dark-mode");
      const link = document.getElementById("darkModeToggle");
      link.textContent = isDark ? "Light Mode" : "Dark Mode";
      localStorage.setItem("darkMode", isDark);
    }
  
    // Initialize from localStorage
    window.addEventListener("DOMContentLoaded", () => {
      const isDark = localStorage.getItem("darkMode") === "true";
      if (isDark) {
        document.body.classList.add("dark-mode");
        const toggleLink = document.getElementById("darkModeToggle");
        if (toggleLink) toggleLink.textContent = "Light Mode";
      }
  
      const toggleLink = document.getElementById("darkModeToggle");
      if (toggleLink) {
        toggleLink.addEventListener("click", (e) => {
          e.preventDefault();
          toggleDarkMode();
        });
      }
    });
  </script>
</body>
</html>
